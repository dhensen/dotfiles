# hyprlock config. See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Colors match the waybar theme. Clear the password with ESC or Ctrl+U.

$font = Iosevka Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(24, 24, 37, 0.78)

    outer_color = rgba(137, 180, 250, 1.0)
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)

    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = 10

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244)
    font_size = 90
    font_family = $font

    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    color = rgb(127, 132, 156)
    font_size = 22
    font_family = $font

    position = 0, 70
    halign = center
    valign = center
}
