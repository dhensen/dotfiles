#################################
#           Backend             #
#################################
# Use OpenGL (GLX) backend for better performance with AMD GPUs
backend = "glx";
vsync = true;

# GLX backend settings optimized for AMD Ryzen/Radeon
glx-no-stencil = true;
glx-no-rebind-pixmap = false;  # Set to false for AMD GPUs
xrender-sync-fence = true;
use-damage = true;  # Enable for better performance

#################################
#           Shadows             #
#################################
shadow = false;
shadow-radius = 9;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.8;

# Shadow exclusion rules
shadow-exclude = [
  "n:w:*VirtualBox*", 
  "class_g = 'Conky'", 
  "class_g = 'Plank'", 
  "_GTK_FRAME_EXTENTS@"
];

#################################
#           Fading              #
#################################
# Optimized fading for smoother animations on AMD Ryzen/Radeon
fading = true;
fade-delta = 4;  # Faster fade speed (lower = faster)
fade-in-step = 0.03;  # Smoother fade-in (smaller steps)
fade-out-step = 0.03;  # Smoother fade-out (smaller steps)
no-fading-openclose = false;  # Enable fading for opening/closing windows

#################################
#           Opacity             #
#################################
inactive-opacity = 1.0;

#################################
#     Background-Blurring       #
#################################
blur: {
  method = "kernel";
  strength = 10;
  background = false;
  background-frame = false;
  background-fixed = false;
}
blur-background-exclude = [
    "class_g = 'slop'"
];

#################################
#       General Settings        #
#################################
# Performance optimizations for AMD Ryzen/Radeon
unredir-if-possible = true;
unredir-if-possible-delay = 0;
unredir-if-possible-exclude = [
  "class_g = 'Firefox'",
  "class_g = 'mpv'"
];

# Prevents lag when dragging windows
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Rounded corners
# Uncomment the line below to enable rounded corners
# corner-radius = 20.0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'firefox'",
  "class_g = 'code'",
  "class_g = 'Dunst'"
];

# Additional settings for AMD hardware
dbe = false;
